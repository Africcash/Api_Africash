services:
  db:
    image: postgres:16-alpine
    container_name: africash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-africash_db}
      POSTGRES_USER: ${DB_USER:-africash_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-africash_secure_password_2026}
    ports:
      - "${DB_PORT_BINDING:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-africash_user} -d ${DB_NAME:-africash_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - africash_network

  redis:
    image: redis:7-alpine
    container_name: africash_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_BINDING:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - africash_network

  minio:
    image: minio/minio:latest
    container_name: africash_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT_BINDING:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_BINDING:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - africash_network

  minio_init:
    image: minio/mc:latest
    container_name: africash_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb local/$${MINIO_BUCKET_NAME:-africash-media} --ignore-existing;
      /usr/bin/mc anonymous set download local/$${MINIO_BUCKET_NAME:-africash-media};
      exit 0;
      "
    networks:
      - africash_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: africash_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-africash_db}
      - DB_USER=${DB_USER:-africash_user}
      - DB_PASSWORD=${DB_PASSWORD:-africash_secure_password_2026}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-africash-media}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin1234}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@africash.io}
      - STELLAR_NETWORK_PASSPHRASE=${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      - STELLAR_RPC_URL=${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      - STELLAR_HORIZON_URL=${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      - USDC_ASSET_CONTRACT_ID=${USDC_ASSET_CONTRACT_ID:-CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWUQX3PUL5L5OBOFBUC}
      - ESCROW_CONTRACT_ID=${ESCROW_CONTRACT_ID:-CCX2P2KDVKVVMX55OPUVYESN5XD73GEJ7EWLNZWNMNLAVZIQVZH5RNRC}
      - PORT=8000
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - africash_network
    # Dokploy Traefik integration (uncomment and replace domain if exposing through Dokploy reverse proxy):
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.africash.rule=Host(`api.yourdomain.com`)"
    #   - "traefik.http.routers.africash.entrypoints=websecure"
    #   - "traefik.http.routers.africash.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.africash.loadbalancer.server.port=8000"

  createsuperuser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: africash_createsuperuser
    restart: "no"
    command: python manage.py createsuperuser
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-africash_db}
      - DB_USER=${DB_USER:-africash_user}
      - DB_PASSWORD=${DB_PASSWORD:-africash_secure_password_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - africash_network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:
  staticfiles_data:
  media_data:

networks:
  africash_network:
    driver: bridge
